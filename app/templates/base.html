<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="{{ asset('style.css') }}">
</head>
<body>
  {% set me = player() %}{% set current = active_course() %}
  <nav class="topnav">
    <a class="brand" href="/">Cert Tutor</a>
    <a href="/" {% if page == 'home' %}aria-current="page"{% endif %}>Home</a>
    <a href="/tracks" {% if page == 'tracks' %}aria-current="page"{% endif %}>Tracks</a>
    {% if current %}
    <a href="/practice/{{ current }}" {% if page == 'practice' %}aria-current="page"{% endif %}>Practice</a>
    <a href="/insights/{{ current }}" {% if page == 'insights' %}aria-current="page"{% endif %}>Insights</a>
    {% endif %}
    <span class="player" title="Level {{ me.level }} · {{ me.xp }} XP · {{ me.streak }}-day streak">
      <span class="lvl">L{{ me.level }}</span>
      <span class="xpbar"><i style="width: {{ (me.xp % 500) / 5 }}%"></i></span>
      <span class="streak{% if me.studied_today %} lit{% endif %}">🔥 {{ me.streak }}</span>
    </span>
  </nav>
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
