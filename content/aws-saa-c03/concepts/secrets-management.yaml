id: secrets-management
domain: secure
title: Secrets Manager and Parameter Store
summary: Keep passwords and config out of code. Secrets Manager also rotates database passwords for you.
icon: aws:secrets-manager

teach: |
  | | Secrets Manager | Systems Manager Parameter Store |
  |---|---|---|
  | Built for | Database passwords, API keys | Config values and simple secrets |
  | **Automatic rotation** | **Yes**, built in for RDS, Aurora, Redshift and DocumentDB | No native rotation |
  | Encryption | Always, with KMS | SecureString parameters use KMS |
  | Cost | Per secret per month | Standard parameters are free |

  - Exam rule: **"rotate automatically"** → **Secrets Manager**.
  - Apps fetch the value at runtime with their IAM role, so nothing sensitive sits in code, AMIs or environment variables.

under_the_hood: |
  Rotation is a Lambda function that Secrets Manager runs on a schedule. It creates a new password, sets it on the database,
  tests it, then marks it as current. During rotation, both the old and new versions are valid for a short time, which is
  why apps that re-read the secret don't go down.

observe:
  - text: "Read a secret the way an app would:"
    cmd: "aws secretsmanager get-secret-value --secret-id prod/orders-db --query SecretString --output text"
  - text: "On your homelab, the API key for this tutor will live in `.env`, which is kept out of git. Secrets Manager is the managed, audited, rotating version of that idea."

case_study: |
  A retailer's compliance team requires database passwords to change every 30 days. They store the RDS credentials in Secrets
  Manager with 30-day rotation, and the order service reads the secret at startup and on connection errors. Passwords now rotate
  automatically and nobody ever sees them.

other_clouds:
  azure: "Azure Key Vault secrets (rotation through Event Grid and Functions); App Configuration for config"
  gcp: "Secret Manager (rotation schedules with Pub/Sub notifications)"

