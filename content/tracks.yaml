# Certification tracks shown on the tracks map.
# Checked against the providers' official certification pages on 2026-10-13.
#
# Each track is a provider; each lane is a role line on that provider's map.
#   col:    0 = Start, 1 = Core, 2 = Advanced, 3 = Specialty
#   spread: true lays a lane's stations evenly across the width (for many small certs)
#   status: planned | active | done
#   sec:    true = security certification (highlighted by the Security focus filter)
#   star:   true = part of the CNCF Kubestronaut set
#   flag:   short warning shown under the station (retiring, beta)
#   note:   extra detail shown on hover
#   full:   official name, shown on hover

columns: [Start, Core, Advanced, Specialty]

tracks:
  - id: aws
    name: AWS
    logo: aws:logo
    color: "#ff9900"
    lanes:
      - name: Architect
        certs:
          - { code: CLF-C02, name: Cloud Practitioner, col: 0, full: AWS Certified Cloud Practitioner }
          - { code: SAA-C03, name: Solutions Architect, col: 1, status: active, content: aws-saa-c03, full: AWS Certified Solutions Architect – Associate }
          - { code: SAP-C02, name: SA Professional, col: 2, full: AWS Certified Solutions Architect – Professional, note: "Exam update to SAP-C03 announced" }
      - name: Developer & DevOps
        certs:
          - { code: DVA-C02, name: Developer, col: 1, full: AWS Certified Developer – Associate, note: "Exam being updated (DVA-C03)" }
          - { code: DOP-C02, name: DevOps Engineer, col: 2, full: AWS Certified DevOps Engineer – Professional }
      - name: Operations
        certs:
          - { code: SOA-C03, name: CloudOps Engineer, col: 1, full: AWS Certified CloudOps Engineer – Associate }
          - { code: ANS-C01, name: Advanced Networking, col: 3, full: AWS Certified Advanced Networking – Specialty, flag: "retires Dec 31 2026" }
      - name: AI & ML
        certs:
          - { code: AIF-C01, name: AI Practitioner, col: 0, full: AWS Certified AI Practitioner }
          - { code: MLA-C01, name: ML Engineer, col: 1, full: AWS Certified Machine Learning Engineer – Associate, note: "Exam being updated (MLA-C02)" }
          - { code: AIP-C01, name: GenAI Developer, col: 2, full: AWS Certified Generative AI Developer – Professional }
      - name: Data
        certs:
          - { code: DEA-C01, name: Data Engineer, col: 1, full: AWS Certified Data Engineer – Associate }
      - name: Security
        certs:
          - { code: SCS-C03, name: Security Specialty, col: 3, sec: true, full: AWS Certified Security – Specialty }
      - name: Business
        certs:
          - { code: AIB-C01, name: AI Business Strategist, col: 0, full: AWS Certified AI Business Strategist, flag: "beta" }

