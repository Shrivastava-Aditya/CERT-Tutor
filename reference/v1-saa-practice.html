    banner = `<div class="banner"><p>Last attempt: <b>${c.result.scaled}</b> (${c.result.pass ? "pass" : "fail"}), ${c.result.correct} of ${c.result.n} correct.</p>
      <button class="btn" data-act="results">View score report</button></div>`;
  }
  const modes = Object.entries(MODES).map(([k, m]) => `<button class="mode" aria-pressed="${ui.mode === k}" data-act="mode" data-v="${k}">
      <span class="t">${m.t}</span><span class="m">${m.n} questions · ${m.min} min</span><span class="d">${m.d}</span></button>`).join("");
  const doms = Object.values(DOM).map(d => `<li><div>${d.name}<div class="wbar"><i style="width:${d.w / 30 * 100}%"></i></div></div><span class="pct">${d.w}%</span></li>`).join("");
  const hist = store.hist.length ? `<section class="panel"><h2>Past attempts</h2><div class="tbl-wrap"><table>
      <thead><tr><th>Date</th><th>Mode</th><th>Correct</th><th>Score</th><th>Result</th></tr></thead><tbody>
      ${store.hist.map(h => `<tr><td>${new Date(h.at).toLocaleDateString(undefined, { month: "short", day: "numeric" })} ${new Date(h.at).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" })}</td>
        <td>${esc(MODES[h.mode] ? MODES[h.mode].t : h.mode)}${h.study ? " (study)" : ""}</td><td class="num">${h.correct}/${h.n}</td><td class="num">${h.scaled}</td>
        <td><span class="chip ${h.pass ? "good" : "bad"}">${h.pass ? "Pass" : "Fail"}</span></td></tr>`).join("")}
      </tbody></table></div><p class="note">Saved in this browser only.</p></section>` : "";
  return `<div class="wrap start">
    <header><div class="eyebrow">AWS Certified Solutions Architect – Associate</div>
      <h1>SAA-C03 Practice Exam</h1>
      <p class="lede">Scenario questions written in the exam's style, with a countdown timer, flags for questions you want to revisit, a review screen, and a score report by domain at the end.</p></header>
    ${banner}
    <div class="facts"><div><b>65</b><span>questions</span></div><div><b>130</b><span>minutes</span></div><div><b>720</b><span>passing score</span></div><div><b>100–1000</b><span>score range</span></div></div>
    <section><h2>Choose a length</h2><div class="modes">${modes}</div></section>
    <label class="toggle" for="study"><input type="checkbox" id="study" ${ui.study ? "checked" : ""}>
      <span><b>Study mode</b><small>Check each answer and read the explanation right away. Leave it off to simulate the real exam, where you only see results at the end.</small></span></label>
    <div class="row"><button class="btn primary lg" data-act="begin">Start ${esc(MODES[ui.mode].t.toLowerCase())}</button></div>
    <section class="panel"><h2>Domains and weights</h2><ul class="domains">${doms}</ul>
      <p class="note">Shorter modes draw questions in these proportions. "Choose two" questions only count as correct if both picks are right, with no partial credit, the same as the real exam. The real exam includes 15 unscored questions you can't identify. This practice exam scores every question.</p>
      <p class="note">AWS doesn't publish its scaling formula, so this page maps your percentage straight onto 100–1000. That puts 720 at about 69% correct. Treat it as an estimate.</p></section>
    ${hist}
    <p class="disclaimer">Unofficial practice questions written for study. Not affiliated with or endorsed by Amazon Web Services. AWS services change, so check details against current AWS documentation.</p>
  </div>`;
}

function topBar(label) {
  const a = store.cur, left = remaining();
  const answered = a.ids.filter(id => (a.ans[id] || []).length).length;
  return `<div class="bar"><div class="wrap"><div class="ttl">SAA-C03 <span>· ${label}</span></div>
    <div class="timer${left < 600 ? " low" : ""}" id="timer" aria-label="Time remaining">${fmt(left)}</div></div>
    <div class="prog"><i style="width:${answered / a.ids.length * 100}%"></i></div></div>`;
}

function examView() {
  const a = store.cur, id = a.ids[a.i], q = Q[id], need = q.a.length;
  const sel = a.ans[id] || [], revealed = a.study && a.rev[id];
  const opts = a.perm[id].map((k, pos) => {
    let cls = "opt " + (need > 1 ? "multi" : "single");
    if (revealed) { if (q.a.includes(k)) cls += " is-right"; else if (sel.includes(k)) cls += " is-wrong"; }
    return `<button class="${cls}" role="${need > 1 ? "checkbox" : "radio"}" aria-checked="${sel.includes(k)}" data-act="opt" data-k="${k}" ${revealed ? "disabled" : ""}>
      <span class="k">${LETTERS[pos]}</span><span>${esc(q.o[k])}</span></button>`;
  }).join("");
  let fb = "";
  if (revealed) {
    const ok = sameSet(sel, q.a);
    fb = `<div class="feedback ${ok ? "good" : "bad"}"><h3>${ok ? "Correct" : "Incorrect"}</h3><p>${esc(q.x)}</p></div>`;
  }
  const instr = need > 1
    ? `<p class="instr${ui.limitWarn ? " warn" : ""}">${ui.limitWarn ? "You can only select " + need + ". Deselect one first." : "Choose " + (need === 2 ? "two" : "three") + "."}</p>`
    : `<p class="instr">Choose one.</p>`;
  const last = a.i === a.ids.length - 1;
  const studyBtn = a.study && !revealed ? `<button class="btn" data-act="reveal" ${sel.length === need ? "" : "disabled"}>Check answer</button>` : "";
  return `${topBar(MODES[a.mode].t + (a.study ? " · study" : ""))}
  <main class="wrap exam">
    <div class="qhead"><span class="qnum">Question ${a.i + 1} of ${a.ids.length}${a.study ? ` · <span class="chip">${DOM[q.d].short}</span>` : ""}</span>
      <button class="flagbtn" aria-pressed="${!!a.flag[id]}" data-act="flag"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3 1h1v14H3zM5 2h8l-2 3 2 3H5z"/></svg>${a.flag[id] ? "Flagged" : "Flag for review"}</button></div>
    <p class="stem">${esc(q.q)}</p>
    ${instr}
    <div class="opts" role="${need > 1 ? "group" : "radiogroup"}" aria-label="Answer options">${opts}</div>
    ${fb}
    <p class="kbd"><kbd>A</kbd>–<kbd>E</kbd> select · <kbd>←</kbd> <kbd>→</kbd> move · <kbd>F</kbd> flag</p>
  </main>
  <nav class="nav"><div class="wrap">
    <button class="btn" data-act="prev" ${a.i === 0 ? "disabled" : ""}>Previous</button>
    <div class="mid">${studyBtn}<button class="btn" data-act="review">Review all</button></div>
    ${last ? `<button class="btn primary" data-act="review">Finish</button>` : `<button class="btn primary" data-act="next">Next</button>`}
  </div></nav>`;
}

function reviewView() {
  const a = store.cur;
  const answered = a.ids.filter(id => (a.ans[id] || []).length === Q[id].a.length).length;
  const partial = a.ids.filter(id => { const l = (a.ans[id] || []).length; return l > 0 && l < Q[id].a.length; }).length;
  const flagged = a.ids.filter(id => a.flag[id]).length;
  const unanswered = a.ids.length - answered;
  const tiles = a.ids.map((id, i) => {
    const full = (a.ans[id] || []).length === Q[id].a.length;
    return `<button class="tile${full ? " ans" : ""}${a.flag[id] ? " flg" : ""}" data-act="goto" data-i="${i}" aria-label="Question ${i + 1}${full ? ", answered" : ", not answered"}${a.flag[id] ? ", flagged" : ""}">${i + 1}</button>`;
  }).join("");
  const confirm = ui.confirmEnd ? `<div class="confirm"><p><b>End the exam now?</b> ${unanswered ? `${unanswered} question${unanswered === 1 ? " is" : "s are"} not fully answered and will be marked wrong.` : "All questions are answered."} You can't change answers after this.</p>
      <div class="row"><button class="btn danger armed" data-act="end">End exam and score</button><button class="btn" data-act="cancelEnd">Keep working</button></div></div>` : "";
  return `${topBar("Review")}
  <main class="wrap review">
    <h2 style="margin:0">Review your answers</h2>
    <div class="counts"><div><b>${answered}</b><span>answered</span></div><div><b>${unanswered}</b><span>not answered${partial ? ` (${partial} partly)` : ""}</span></div><div><b>${flagged}</b><span>flagged</span></div><div><b id="timer2">${fmt(remaining())}</b><span>left</span></div></div>
    <div class="legend"><span><i class="sw ans"></i>Answered</span><span><i class="sw"></i>Not answered</span><span><i class="sw flg"></i>Flagged</span></div>
    <div class="grid">${tiles}</div>
    ${confirm}
    <div class="row">
      ${flagged ? `<button class="btn" data-act="firstFlag">Go to first flagged</button>` : ""}
      ${unanswered ? `<button class="btn" data-act="firstOpen">Go to first unanswered</button>` : ""}
      <button class="btn" data-act="back">Back to question ${a.i + 1}</button>
      ${ui.confirmEnd ? "" : `<button class="btn primary" data-act="askEnd">End exam</button>`}
    </div>
  </main>`;
}

function resultsView() {
  const a = store.cur, r = a.result;
  const pos = (r.scaled - 100) / 900 * 100, cut = (PASS - 100) / 900 * 100;
  const doms = Object.keys(DOM).filter(d => r.per[d].t).map(d => {
    const p = r.per[d], pct = p.c / p.t * 100, ok = pct >= 70;
    return `<div class="drow"><span class="n">${DOM[d].name}<small>${DOM[d].w}%</small></span>
      <span class="chip ${ok ? "good" : "bad"}">${ok ? "Meets competencies" : "Needs improvement"}</span>
      <div class="bar2"><i style="width:${pct}%;background:var(${ok ? "--good" : "--bad"})"></i><span class="mk"></span></div>
      <span class="meta">${p.c} of ${p.t} correct · ${Math.round(pct)}%</span></div>`;
  }).join("");
  const items = a.ids.map((id, i) => ({ id, i, q: Q[id], sel: a.ans[id] || [], ok: sameSet(a.ans[id] || [], Q[id].a), fl: !!a.flag[id] }));
  const wrongN = items.filter(x => !x.ok).length, flagN = items.filter(x => x.fl).length;
  const shown = items.filter(x => ui.filter === "all" || (ui.filter === "wrong" && !x.ok) || (ui.filter === "flag" && x.fl));
  const list = shown.length ? shown.map(x => {
    const opts = a.perm[x.id].map((k, pos2) => {
      const right = x.q.a.includes(k), mine = x.sel.includes(k);
      const cls = "opt " + (x.q.a.length > 1 ? "multi" : "single") + (right ? " is-right" : mine ? " is-wrong" : "");
      const tag = right && mine ? "Your answer · correct" : right ? "Correct answer" : mine ? "Your answer" : "";
      return `<div class="${cls}"><span class="k">${LETTERS[pos2]}</span><span>${esc(x.q.o[k])}${tag ? `<span class="tag">${tag}</span>` : ""}</span></div>`;
    }).join("");
    return `<article class="ritem"><div class="top"><span class="qnum">Q${x.i + 1}</span>
        <span class="chip ${x.ok ? "good" : "bad"}">${x.ok ? "Correct" : x.sel.length ? "Incorrect" : "Not answered"}</span>
        <span class="chip">${DOM[x.q.d].short}</span>${x.fl ? `<span class="chip flag">Flagged</span>` : ""}${x.q.a.length > 1 ? `<span class="chip">Choose ${x.q.a.length === 2 ? "two" : "three"}</span>` : ""}</div>
      <p class="stem">${esc(x.q.q)}</p><div class="opts">${opts}</div>
      <div class="expl"><b>Explanation</b>${esc(x.q.x)}</div></article>`;
  }).join("") : `<p class="empty">Nothing to show for this filter.</p>`;
  return `<div class="wrap results">
    <header><div class="eyebrow">Score report · ${esc(MODES[a.mode].t)}${a.study ? " · study mode" : ""}</div></header>
    <section class="panel">
      <div class="score"><div class="big">${r.scaled}</div>
        <div><p class="verdict ${r.pass ? "pass" : "fail"}">${r.pass ? "Pass" : "Fail"}</p>
          <div class="stats"><span><b>${r.correct}/${r.n}</b> correct</span><span><b>${Math.round(r.correct / r.n * 100)}%</b></span><span><b>${fmt(r.used)}</b> used${r.timeUp ? " (time ran out)" : ""}</span></div></div></div>
      <div class="scale"><span class="fill" style="width:${pos}%;background:var(${r.pass ? "--good" : "--bad"})"></span><span class="cut" style="left:${cut}%"><span>720</span></span></div>
      <div class="scale-ends"><span>100</span><span>1000</span></div>
      <p class="note">Estimated score: your percentage mapped straight onto AWS's 100–1000 scale. The real exam uses its own scaling.</p>
    </section>
    <section class="panel"><h2>By domain</h2>${doms}
      <p class="note">The line on each bar marks 70%. AWS's score report shows "Meets competencies" or "Needs improvement" for each domain, and this page uses 70% as a stand-in threshold.</p></section>
    <div class="row"><button class="btn primary" data-act="retake">Retake these questions</button><button class="btn" data-act="home">New exam</button></div>
    <section><h2>Answers and explanations</h2>
      <div class="tabs" role="group" aria-label="Filter questions">
        <button class="tab" aria-pressed="${ui.filter === "all"}" data-act="filter" data-v="all">All (${items.length})</button>
        <button class="tab" aria-pressed="${ui.filter === "wrong"}" data-act="filter" data-v="wrong">Incorrect (${wrongN})</button>
        <button class="tab" aria-pressed="${ui.filter === "flag"}" data-act="filter" data-v="flag">Flagged (${flagN})</button></div>
    </section>
    <div style="display:grid;gap:14px">${list}</div>
  </div>`;
}

/* ---------------- timer ---------------- */
function syncTicker() {
  const live = store.cur && !store.cur.done && (view === "exam" || view === "review");
  if (live && !ticker) ticker = setInterval(tick, 1000);
  if (!live && ticker) { clearInterval(ticker); ticker = null; }
}
function tick() {
  const left = remaining();
  if (left <= 0) { finish(); return; }
  const t = document.getElementById("timer"); if (t) { t.textContent = fmt(left); t.classList.toggle("low", left < 600); }
  const t2 = document.getElementById("timer2"); if (t2) t2.textContent = fmt(left);
}

/* ---------------- events ---------------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const act = b.dataset.act, a = store.cur;
  if (act !== "discard") ui.discardArmed = false;
  switch (act) {
    case "mode": ui.mode = b.dataset.v; render(); break;
    case "begin": startExam(ui.mode, ui.study); window.scrollTo(0, 0); break;
    case "resume": view = "exam"; render(); window.scrollTo(0, 0); break;
    case "discard": if (ui.discardArmed) { store.cur = null; save(); ui.discardArmed = false; } else ui.discardArmed = true; render(); break;
    case "results": view = "results"; render(); window.scrollTo(0, 0); break;
    case "opt": choose(+b.dataset.k); break;
    case "flag": toggleFlag(); break;
    case "reveal": reveal(); break;
    case "prev": go(a.i - 1); break;
    case "next": go(a.i + 1); break;
    case "review": view = "review"; ui.confirmEnd = false; ui.focusK = null; render(); window.scrollTo(0, 0); break;
    case "goto": go(+b.dataset.i); break;
    case "back": go(a.i); break;
    case "firstFlag": go(a.ids.findIndex(id => a.flag[id])); break;
    case "firstOpen": go(a.ids.findIndex(id => (a.ans[id] || []).length !== Q[id].a.length)); break;
    case "askEnd": ui.confirmEnd = true; render(); break;
    case "cancelEnd": ui.confirmEnd = false; render(); break;
    case "end": finish(); break;
    case "retake": startExam(a.mode, a.study, shuffle(a.ids)); window.scrollTo(0, 0); break;
    case "home": view = "start"; render(); window.scrollTo(0, 0); break;
    case "filter": ui.filter = b.dataset.v; render(); break;
  }
});
document.addEventListener("change", e => { if (e.target.id === "study") ui.study = e.target.checked; });
document.addEventListener("keydown", e => {
  if (view !== "exam" || !store.cur || store.cur.done || e.metaKey || e.ctrlKey || e.altKey) return;
  const a = store.cur, id = a.ids[a.i], key = e.key.toLowerCase();
  const pos = "abcde".indexOf(key) >= 0 ? "abcde".indexOf(key) : "12345".indexOf(key);
  if (pos >= 0 && pos < a.perm[id].length) { e.preventDefault(); choose(a.perm[id][pos]); }
  else if (e.key === "ArrowRight" && a.i < a.ids.length - 1) { e.preventDefault(); go(a.i + 1); }
  else if (e.key === "ArrowLeft" && a.i > 0) { e.preventDefault(); go(a.i - 1); }
  else if (key === "f") { e.preventDefault(); toggleFlag(); }
});

/* ---------------- boot ---------------- */
function start(data) {
  if (data && data.view) { view = data.view; Object.assign(ui, data.ui || {}); }
  if (store.cur && !store.cur.done && remaining() <= 0) { finish(); return; }
  render();
}
window.claude?.hot?.snapshot?.(() => ({ view, ui }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
